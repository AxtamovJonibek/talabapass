<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: "foiz", pct: 30, price: 26000, days: { Du: true, Se: true, Ch: true, Pa: true, Ju: true, Sh: false, Ya: false } };
  }
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
  renderVals() {
    var s = this.state, self = this;
    var types = [["foiz", "Foiz"], ["narx", "Yangi narx"], ["bir", "1 + 1"]].map(function (t) {
      var on = s.type === t[0];
      return { label: t[1], on: on ? "true" : "false", bg: on ? "#FFFFFF" : "transparent", pick: function () { self.setState({ type: t[0] }); } };
    });
    var days = ["Du", "Se", "Ch", "Pa", "Ju", "Sh", "Ya"].map(function (k) {
      var on = !!s.days[k];
      return { label: k, on: on ? "true" : "false", bg: on ? "#141414" : "#FFFFFF", fg: on ? "#FFFFFF" : "#141414", bd: on ? "#141414" : "#D6D3CA",
        pick: function () { var d = Object.assign({}, s.days); d[k] = !d[k]; self.setState({ days: d }); } };
    });
    var dayCount = Object.keys(s.days).filter(function (k) { return s.days[k]; }).length;
    var newPrice = Math.round(38000 * (100 - s.pct) / 100 / 100) * 100;
    var valueLabel = "Chegirma", valueText = "−" + s.pct + "%", badge = "−" + s.pct + "%", previewPrice = this.fmt(newPrice) + " so'm  ·  38 000 o'rniga";
    if (s.type === "narx") { valueLabel = "Yangi narx"; valueText = this.fmt(s.price); badge = "−" + Math.round((1 - s.price / 38000) * 100) + "%"; previewPrice = this.fmt(s.price) + " so'm  ·  38 000 o'rniga"; }
    if (s.type === "bir") { valueLabel = "Aksiya"; valueText = "1+1"; badge = "1+1"; previewPrice = "Ikkinchisi bepul"; }
    return {
      types: types, days: days, dayCount: dayCount, valueLabel: valueLabel, valueText: valueText, badge: badge, previewPrice: previewPrice,
      inc: function () { if (s.type === "narx") self.setState({ price: Math.min(37000, s.price + 1000) }); else self.setState({ pct: Math.min(90, s.pct + 5) }); },
      dec: function () { if (s.type === "narx") self.setState({ price: Math.max(1000, s.price - 1000) }); else self.setState({ pct: Math.max(5, s.pct - 5) }); }
    };
  }
}
</script>
