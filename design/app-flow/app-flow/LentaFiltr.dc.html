<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ilova: saralash va filtr</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F3F1EE; color: #111">
  <dc-import name="Lenta" hint-size="390px,844px"></dc-import>
  <a href="Lenta.dc.html" aria-label="Yopish" style="position: absolute; inset: 0; background: rgba(17, 17, 17, 0.45)"></a>

  <div role="dialog" aria-label="Saralash" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F3F1EE; border-radius: 28px 28px 0 0; padding: 10px 20px 30px">
    <div aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: #D6D2CB; margin: 0 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 14px">
      <h2 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em; font-variation-settings: 'wdth' 112">Saralash</h2>
      <a href="Lenta.dc.html" aria-label="Yopish" style="width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </a>
    </div>

    <div role="radiogroup" aria-label="Saralash tartibi" style="margin-top: 14px; background: #fff; border-radius: 20px; padding: 0 16px">
      <sc-for list="{{sorts}}" as="o" hint-placeholder-count="4">
        <button type="button" role="radio" aria-checked="{{o.checked}}" onClick="{{o.pick}}" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: 0; border-bottom: 1.5px solid {{o.line}}; background: transparent; color: #111; text-align: left; cursor: pointer">
          <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 800">{{o.name}}</span><span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #6B6760">{{o.sub}}</span></span>
          <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{o.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{o.dot}}"></span></span>
        </button>
      </sc-for>
    </div>

    <button type="button" role="switch" aria-checked="{{liveOn}}" onClick="{{toggleLive}}" style="margin-top: 10px; width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; border-radius: 20px; background: #fff; color: #111; text-align: left; cursor: pointer">
      <span style="flex: 1"><span style="display: block; font-size: 16px; font-weight: 800">Faqat hozir ochiqlar</span><span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #6B6760">Yopiqlari ro'yxatda ko'rinmaydi</span></span>
      <span style="width: 46px; height: 28px; border-radius: 14px; background: {{track}}; position: relative; display: block; flex-shrink: 0">
        <span style="position: absolute; top: 3px; left: {{knob}}; width: 22px; height: 22px; border-radius: 50%; background: #fff"></span>
      </span>
    </button>

    <div style="display: flex; gap: 10px; margin-top: 16px">
      <button type="button" onClick="{{reset}}" style="height: 56px; padding: 0 20px; border-radius: 18px; border: 2px solid #111; background: #fff; color: #111; font-size: 16px; font-weight: 800; cursor: pointer">Tozalash</button>
      <a href="Lenta.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #2432D6; color: #fff; font-size: 17px; font-weight: 800; text-decoration: none">{{showText}}</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: "near", live: false };
  }
  renderVals() {
    var self = this, s = this.state;
    var LIST = [
      { id: "near", name: "Eng yaqin", sub: "Joylashuvingizga qarab" },
      { id: "biggest", name: "Eng katta chegirma", sub: "Foizi yuqorilari tepada" },
      { id: "ending", name: "Tez tugaydi", sub: "Qoldig'i oz yoki muddati yaqin" },
      { id: "new", name: "Yangi", sub: "Oxirgi qo'shilganlar" }
    ];
    var sorts = LIST.map(function (o, i) {
      var on = o.id === s.sort;
      return { name: o.name, sub: o.sub, checked: on ? "true" : "false", line: i === LIST.length - 1 ? "transparent" : "#E3DFD8",
        ring: on ? "#2432D6" : "#CFCBC4", dot: on ? "#2432D6" : "transparent", pick: function () { self.setState({ sort: o.id }); } };
    });
    return {
      sorts: sorts,
      liveOn: s.live ? "true" : "false", track: s.live ? "#2432D6" : "#CFCBC4", knob: s.live ? "21px" : "3px",
      toggleLive: function () { self.setState({ live: !s.live }); },
      reset: function () { self.setState({ sort: "near", live: false }); },
      showText: s.live ? "Ko'rsatish · 4 ta" : "Ko'rsatish · 6 ta"
    };
  }
}
</script>
</body>
</html>
