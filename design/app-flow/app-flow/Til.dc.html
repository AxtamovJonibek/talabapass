<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ilova: til tanlash</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Golos+Text:wght@400..900&display=swap">
<style>
body{margin:0;font-family:'Archivo','Golos Text',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EE; padding: 56px 24px 36px; display: flex; flex-direction: column; position: relative; overflow: hidden; color: #111">
  <div style="display: flex; align-items: center; gap: 8px; min-height: 44px">
    <span style="font-weight: 900; font-size: 27px; letter-spacing: -0.02em; font-variation-settings: 'wdth' 112">talaba</span>
    <span style="background: #2432D6; color: #fff; border-radius: 9px; padding: 1px 11px 3px; font-weight: 800; font-size: 22px; font-variation-settings: 'wdth' 112">Pass</span>
  </div>

  <div style="flex: 1; position: relative; display: flex; align-items: center; justify-content: center; min-height: 0">
    <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 2px dashed #D6D2CB; top: 50%; left: 50%; transform: translate(-50%, -50%)"></div>
    <div style="position: relative; width: 264px; transform: rotate(-4deg)">
      <div style="background: #2432D6; border-radius: 28px; padding: 20px 20px 22px; color: #fff; box-shadow: 0 18px 32px rgba(36, 50, 214, 0.25)">
        <div style="font-size: 13px; font-weight: 500; opacity: 0.85">{{t.cardTop}}</div>
        <div style="font-size: 76px; font-weight: 900; line-height: 1; margin: 6px 0 2px; font-variation-settings: 'wdth' 62; letter-spacing: -0.01em">−25%</div>
        <div style="font-size: 17px; font-weight: 700">{{t.cardBottom}}</div>
      </div>
      <div style="position: absolute; top: -24px; right: -20px; background: #FF5A1F; color: #111; border-radius: 20px; padding: 4px 18px 8px; font-size: 46px; font-weight: 900; line-height: 1; transform: rotate(9deg); font-variation-settings: 'wdth' 62; box-shadow: 0 10px 20px rgba(255, 90, 31, 0.3)">1+1</div>
    </div>
  </div>

  <h1 style="margin: 0; font-size: 34px; line-height: 1.06; font-weight: 900; letter-spacing: -0.02em; font-variation-settings: 'wdth' 112">{{t.title}}</h1>
  <p style="margin: 10px 0 18px; font-size: 16px; line-height: 1.45; color: #3A3834">{{t.lead}}</p>

  <div role="radiogroup" aria-label="Til · Язык · Language" style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{langs}}" as="l" hint-placeholder-count="3">
      <button type="button" role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="display: flex; align-items: center; gap: 12px; height: 50px; padding: 0 16px; border-radius: 16px; background: #fff; border: 2px solid {{l.border}}; cursor: pointer; text-align: left; color: #111">
        <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid {{l.ring}}; box-sizing: border-box; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><span style="width: 10px; height: 10px; border-radius: 50%; background: {{l.dot}}"></span></span>
        <span style="flex: 1; font-size: 17px; font-weight: 700">{{l.name}}</span>
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: #6B6760">{{l.code}}</span>
      </button>
    </sc-for>
  </div>

  <a href="Main.dc.html" style="margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; height: 58px; border-radius: 20px; background: #2432D6; color: #fff; font-size: 18px; font-weight: 800; text-decoration: none">{{t.next}}
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: "uz" };
  }
  renderVals() {
    var self = this, cur = this.state.lang;
    var T = {
      uz: { title: "Xush kelibsiz!", lead: "Ilova tilini tanlang. Keyin sozlamalarda o‘zgartirish mumkin.", next: "Davom etish", cardTop: "Kitob do‘koni · universitet yonida", cardBottom: "Darsliklar va daftarlar" },
      ru: { title: "Добро пожаловать!", lead: "Выберите язык приложения. Его можно изменить в настройках.", next: "Продолжить", cardTop: "Книжный магазин · рядом с вузом", cardBottom: "Учебники и тетради" },
      en: { title: "Welcome!", lead: "Choose the app language. You can change it later in settings.", next: "Continue", cardTop: "Bookstore · next to campus", cardBottom: "Textbooks and notebooks" }
    };
    var list = [
      { id: "uz", name: "O‘zbekcha", code: "UZ" },
      { id: "ru", name: "Русский", code: "RU" },
      { id: "en", name: "English", code: "EN" }
    ];
    var langs = list.map(function (l) {
      var on = l.id === cur;
      return { name: l.name, code: l.code, checked: on ? "true" : "false",
        border: on ? "#111111" : "#FFFFFF", ring: on ? "#2432D6" : "#CFCBC4", dot: on ? "#2432D6" : "transparent",
        pick: function () { self.setState({ lang: l.id }); } };
    });
    return { t: T[cur], langs: langs };
  }
}
</script>
</body>
</html>
