<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<title>Ilova: chegirma sahifasi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EE; position: relative; overflow: hidden; color: #111">

  <div style="position: relative; height: 330px; background: #F1D9D9; overflow: hidden">
    <span aria-hidden="true" style="position: absolute; right: -6px; top: 120px; font-size: 150px; line-height: 0.8; font-weight: 900; font-variation-settings: 'wdth' 62; color: #7E1F1F; opacity: 0.12; white-space: nowrap">KITOB</span>
    <div aria-hidden="true" style="position: absolute; right: 18px; bottom: 18px; display: flex; gap: 5px">
      <span style="width: 18px; height: 6px; border-radius: 3px; background: #111"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(17, 17, 17, 0.3)"></span>
      <span style="width: 6px; height: 6px; border-radius: 3px; background: rgba(17, 17, 17, 0.3)"></span>
    </div>
  </div>
  <a href="Lenta.dc.html" aria-label="Orqaga" style="position: absolute; top: 52px; left: 16px; width: 44px; height: 44px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; text-decoration: none">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
  </a>
  <button type="button" onClick="{{toggleSave}}" aria-pressed="{{savedAria}}" aria-label="Saralanganga qo'shish" style="position: absolute; top: 52px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="{{saveFill}}" stroke="{{saveStroke}}" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
  </button>

  <div style="position: absolute; left: 20px; top: 268px; transform: rotate(-3deg); transform-origin: left center">
    <div style="position: relative; background: #fff; border: 2px solid #111; border-radius: 16px; padding: 12px 20px 12px 34px">
      <span aria-hidden="true" style="position: absolute; left: 12px; top: 50%; margin-top: -6px; width: 12px; height: 12px; border-radius: 50%; background: #F3F1EE; border: 2px solid #111; box-sizing: border-box"></span>
      <div style="display: flex; align-items: baseline; gap: 6px">
        <span style="font-size: 48px; line-height: 0.92; font-weight: 900; font-variation-settings: 'wdth' 62">48 000</span>
        <span style="font-size: 16px; font-weight: 800">so'm</span>
      </div>
      <div style="margin-top: 4px; display: flex; gap: 8px; font-size: 14px; font-weight: 700">
        <span style="color: #6B6760; text-decoration: line-through">60 000</span>
        <span style="color: #1F8A47">12 000 tejaysiz</span>
      </div>
    </div>
    <span style="position: absolute; right: -54px; top: -26px; background: #FF5A1F; color: #111; border-radius: 14px; padding: 2px 12px 5px; font-size: 40px; line-height: 1.05; font-weight: 900; font-variation-settings: 'wdth' 62; transform: rotate(11deg)">−20%</span>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 392px; padding: 0 24px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 10px; background: #7E1F1F; color: #fff; font-size: 14px; font-weight: 900; display: flex; align-items: center; justify-content: center">S</span>
      <span style="flex: 1; min-width: 0; font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 5px">Sahifa
        <svg width="15" height="15" viewBox="0 0 24 24" fill="#1F8A47" role="img" aria-label="Tasdiqlangan hamkor"><path d="M12 2l2.4 1.8 3-.2.9 2.9 2.5 1.7-1 2.8 1 2.8-2.5 1.7-.9 2.9-3-.2L12 22l-2.4-1.8-3 .2-.9-2.9-2.5-1.7 1-2.8-1-2.8 2.5-1.7.9-2.9 3 .2z"/><path d="M8.3 12.2l2.5 2.5 4.9-5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      <a href="tel:+998901234567" aria-label="Qo'ng'iroq qilish" style="width: 40px; height: 40px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg>
      </a>
      <a href="https://t.me/" aria-label="Telegram" style="width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 1.5px dashed #CFCBC4; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #8A877F; font-size: 9px; font-weight: 800; letter-spacing: 0.04em">TG</a>
      <a href="https://instagram.com/" aria-label="Instagram" style="width: 40px; height: 40px; border-radius: 50%; background: #fff; border: 1.5px dashed #CFCBC4; box-sizing: border-box; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #8A877F; font-size: 9px; font-weight: 800; letter-spacing: 0.04em">IG</a>
    </div>

    <h1 style="margin: 14px 0 0; font-size: 34px; line-height: 1.02; font-weight: 900; letter-spacing: -0.025em; font-variation-settings: 'wdth' 112">Darsliklar va daftarlar</h1>
    <div style="margin-top: 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 800; color: {{statusColor}}">
      <span style="width: 9px; height: 9px; border-radius: 50%; background: {{statusDot}}"></span>{{statusText}}
    </div>

    <dl style="margin: 20px 0 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px">
      <div style="display: flex; align-items: baseline; gap: 8px">
        <dt style="font-weight: 600; color: #6B6760">Har kuni</dt><span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #CFCBC4"></span><dd style="margin: 0; font-weight: 800; font-variant-numeric: tabular-nums">09:00–21:00</dd>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <dt style="font-weight: 600; color: #6B6760">Bugun qoldi</dt><span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #CFCBC4"></span><dd style="margin: 0; font-weight: 800; font-variant-numeric: tabular-nums">{{leftValue}}</dd>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <dt style="font-weight: 600; color: #6B6760">Har bir talabaga</dt><span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #CFCBC4"></span><dd style="margin: 0; font-weight: 800">kuniga 1 marta</dd>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <dt style="font-weight: 600; color: #6B6760">Aksiya</dt><span aria-hidden="true" style="flex: 1; border-bottom: 2px dotted #CFCBC4"></span><dd style="margin: 0; font-weight: 800">30-dekabrgacha</dd>
      </div>
    </dl>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 26px; background: #F3F1EE; display: flex; gap: 10px; align-items: stretch">
    <a href="Yonalish.dc.html" aria-label="Qanday boraman, 0,4 km" style="position: relative; width: 74px; height: 64px; flex-shrink: 0; border-radius: 20px; background: #E9F0E4; border: 2px solid #111; box-sizing: border-box; overflow: hidden; text-decoration: none; color: #111">
      <svg width="74" height="64" viewBox="0 0 74 64" aria-hidden="true" style="position: absolute; inset: 0">
        <path d="M-4 22 L80 10" stroke="#fff" stroke-width="7"/>
        <path d="M22 -4 L30 70" stroke="#fff" stroke-width="5"/>
        <path d="M-4 48 C20 40, 46 56, 80 44" stroke="#fff" stroke-width="5" fill="none"/>
        <path d="M56 -4 L50 70" stroke="#F3E6C4" stroke-width="4"/>
      </svg>
      <svg width="22" height="28" viewBox="0 0 22 28" aria-hidden="true" style="position: absolute; left: 26px; top: 8px">
        <path d="M11 27s9-8.4 9-15.5A9 9 0 0 0 2 11.5C2 18.6 11 27 11 27z" fill="#2432D6" stroke="#111" stroke-width="2"/>
        <circle cx="11" cy="11.5" r="3.4" fill="#fff"/>
      </svg>
      <span style="position: absolute; left: 50%; bottom: 5px; transform: translateX(-50%); background: #111; color: #fff; border-radius: 8px; padding: 1px 6px 2px; font-size: 11px; font-weight: 800; white-space: nowrap">0,4 km</span>
    </a>
    <div style="flex: 1; min-width: 0">
      <sc-if value="{{canClaim}}" hint-placeholder-val="{{ true }}">
        <a href="Chegirma.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 64px; border-radius: 20px; background: {{ctaBg}}; color: #fff; font-size: 18px; font-weight: 800; text-decoration: none">{{ctaText}}
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
      </sc-if>
      <sc-if value="{{blocked}}" hint-placeholder-val="{{ false }}">
        <button type="button" disabled style="width: 100%; height: 64px; border-radius: 20px; border: 0; background: #E9E6E0; color: #3A3834; font-size: 16px; font-weight: 800; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
          {{ctaText}}<span style="font-size: 12px; font-weight: 600; color: #6B6760">{{ctaSub}}</span>
        </button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"holat":{"editor":"enum","options":["ochiq","yopiq","tugadi","kupon"],"default":"ochiq"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { saved: false };
  }
  renderVals() {
    var self = this, s = this.state;
    var holat = this.props.holat || "ochiq";
    var open = holat !== "yopiq";
    var CTA = {
      ochiq: { text: "Chegirmani olish", bg: "#2432D6" },
      kupon: { text: "Kuponni ko'rsatish", bg: "#111111" },
      yopiq: { text: "Ertaga 09:00 da ochiladi", sub: "Saqlab qo'ying, unutmaysiz" },
      tugadi: { text: "Bugungi kuponlar tugadi", sub: "Ertaga 09:00 da yana 50 ta" }
    };
    var c = CTA[holat] || CTA.ochiq;
    return {
      statusText: open ? "Hozir ochiq · 21:00 gacha" : "Yopiq · ertaga 09:00 da ochiladi",
      statusColor: open ? "#1F8A47" : "#55524D",
      statusDot: open ? "#3BD16F" : "#8A877F",
      leftValue: holat === "tugadi" ? "0 / 50" : "37 / 50",
      canClaim: holat === "ochiq" || holat === "kupon",
      blocked: holat === "yopiq" || holat === "tugadi",
      ctaText: c.text, ctaSub: c.sub || "", ctaBg: c.bg || "#2432D6",
      saveFill: s.saved ? "#2432D6" : "none", saveStroke: s.saved ? "#2432D6" : "#111111",
      savedAria: s.saved ? "true" : "false",
      toggleSave: function () { self.setState({ saved: !s.saved }); }
    };
  }
}
</script>
</body>
</html>
