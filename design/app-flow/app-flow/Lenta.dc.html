<!doctype html>
<html lang="uz">
<head>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<style>
body{margin:0;font-family:'Archivo',system-ui,sans-serif}
button,input{font-family:inherit}
.tp-scroll{scrollbar-width:none}
.tp-scroll::-webkit-scrollbar{display:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F1EE; position: relative; overflow: hidden; color: #111">
  <div class="tp-scroll" style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto; padding: 52px 0 24px">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 24px">
      <button type="button" aria-label="Joy: Toshkent, o'zgartirish" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0; margin-left: -2px; border: 0; background: transparent; color: #111; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2432D6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <span style="font-size: 15px; font-weight: 800">Toshkent</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#55524D" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <button type="button" aria-label="Bildirishnomalar, 2 ta yangi" style="position: relative; width: 44px; height: 44px; border-radius: 50%; border: 0; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></svg>
        <span style="position: absolute; top: 10px; right: 11px; width: 9px; height: 9px; border-radius: 50%; background: #FF5A1F; border: 2px solid #fff"></span>
      </button>
    </div>

    <h1 style="margin: 6px 24px 0; font-size: 34px; line-height: 1.05; font-weight: 900; letter-spacing: -0.02em; font-variation-settings: 'wdth' 112">Bugun <span style="display: inline-block; background: #FF5A1F; border-radius: 10px; padding: 0 8px 3px; transform: rotate(-2deg)">arzon.</span></h1>

    <div style="margin: 14px 24px 0; display: flex; align-items: center; height: 52px; box-sizing: border-box; background: #fff; border: 2px solid #111; border-radius: 16px; padding: 0 6px 0 14px; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6B6760" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Qidiruv</label>
      <input id="q" type="search" placeholder="Kitob, chop etish, kofe…" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; font-weight: 600; color: #111">
      <a href="LentaFiltr.dc.html" aria-label="Saralash va filtr" style="width: 40px; height: 40px; border-radius: 12px; background: #F3F1EE; display: flex; align-items: center; justify-content: center; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </a>
    </div>

    <div class="tp-scroll" role="tablist" aria-label="Kategoriyalar" style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 24px 0">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button type="button" role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 15px; border-radius: 19px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.color}}; font-size: 14px; font-weight: 800; cursor: pointer; white-space: nowrap">{{c.name}}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; padding: 14px 24px 2px">
      <span style="flex: 1; font-size: 13px; font-weight: 700; color: #6B6760">{{count}}</span>
      <button type="button" role="switch" aria-checked="{{liveOn}}" onClick="{{toggleLive}}" style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0; border: 0; background: transparent; color: #111; font-size: 13px; font-weight: 800; cursor: pointer">
        <span style="width: 34px; height: 20px; border-radius: 10px; background: {{track}}; position: relative; display: block">
          <span style="position: absolute; top: 2px; left: {{knob}}; width: 16px; height: 16px; border-radius: 50%; background: #fff"></span>
        </span>
        Hozir ochiq
      </button>
      <a href="LentaFiltr.dc.html" style="display: flex; align-items: center; gap: 4px; height: 36px; color: #2432D6; font-size: 13px; font-weight: 800; text-decoration: none">Eng yaqin
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2432D6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 26px; padding: 10px 24px 0">
      <sc-for list="{{deals}}" as="d" hint-placeholder-count="3">
        <a href="Chegirma.dc.html" style="display: block; color: #111; text-decoration: none">
          <div style="position: relative">
            <div style="position: relative; height: 188px; border-radius: 22px; background: {{d.tile}}; overflow: hidden">
              <span aria-hidden="true" style="position: absolute; right: -4px; top: 56px; font-size: 82px; line-height: 0.8; font-weight: 900; font-variation-settings: 'wdth' 62; color: {{d.ink}}; opacity: 0.13; text-transform: uppercase; white-space: nowrap">{{d.catName}}</span>
              <span style="position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(255, 255, 255, 0.94); font-size: 12px; font-weight: 800; color: {{d.statusColor}}">
                <span style="width: 7px; height: 7px; border-radius: 50%; background: {{d.dot}}"></span>{{d.status}}
              </span>
            </div>
            <span style="position: absolute; top: -8px; right: -6px; background: #FF5A1F; color: #111; border-radius: 12px; padding: 1px 10px 4px; font-size: 32px; line-height: 1.05; font-weight: 900; font-variation-settings: 'wdth' 62; transform: rotate(7deg)">{{d.pct}}</span>
            <div style="position: absolute; left: 12px; bottom: -14px; transform: rotate(-3deg); transform-origin: left center; background: #fff; border: 2px solid #111; border-radius: 12px; padding: 5px 12px 6px 24px; display: flex; align-items: baseline; gap: 5px">
              <span aria-hidden="true" style="position: absolute; left: 8px; top: 50%; margin-top: -4px; width: 8px; height: 8px; border-radius: 50%; background: #F3F1EE; border: 2px solid #111; box-sizing: border-box"></span>
              <span style="font-size: 26px; line-height: 1; font-weight: 900; font-variation-settings: 'wdth' 62">{{d.price}}</span>
              <span style="font-size: 13px; font-weight: 800">so'm</span>
              <sc-if value="{{d.hasOld}}" hint-placeholder-val="{{ true }}">
                <span style="font-size: 13px; font-weight: 700; color: #6B6760; text-decoration: line-through">{{d.old}}</span>
              </sc-if>
            </div>
          </div>
          <div style="margin-top: 24px; display: flex; align-items: flex-start; gap: 12px">
            <div style="flex: 1; min-width: 0">
              <div style="font-size: 19px; line-height: 1.15; font-weight: 800; letter-spacing: -0.01em">{{d.title}}</div>
              <div style="margin-top: 4px; font-size: 13px; font-weight: 600; color: #6B6760; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.store}} · {{d.area}}</div>
            </div>
            <span style="flex-shrink: 0; margin-top: 3px; font-size: 13px; font-weight: 800; color: {{d.leftColor}}">{{d.left}}</span>
          </div>
        </a>
      </sc-for>
      <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
        <div style="background: #fff; border-radius: 22px; padding: 28px 20px; text-align: center">
          <div style="font-size: 17px; font-weight: 800">Bu filtr bo'yicha hozircha chegirma yo'q</div>
          <button type="button" onClick="{{reset}}" style="margin-top: 12px; height: 44px; padding: 0 18px; border-radius: 14px; border: 2px solid #111; background: #fff; font-size: 15px; font-weight: 800; color: #111; cursor: pointer">Filtrni tozalash</button>
        </div>
      </sc-if>
    </div>
  </div>

  <nav aria-label="Asosiy bo'limlar" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; background: #fff; border-top: 1.5px solid #E3DFD8; display: flex; padding: 8px 6px 0">
    <a href="Lenta.dc.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111; font-size: 12px; font-weight: 800">
      <span style="width: 56px; height: 32px; border-radius: 16px; background: #DDE1FA; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2432D6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-7 7z"/><circle cx="7.5" cy="8" r="1.5"/></svg></span>Chegirmalar
    </a>
    <a href="Lenta.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55524D; font-size: 12px; font-weight: 700">
      <span style="height: 32px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55524D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></span>Yaqin
    </a>
    <a href="Lenta.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55524D; font-size: 12px; font-weight: 700">
      <span style="height: 32px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55524D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M14 8v10"/></svg></span>Kupon
    </a>
    <a href="Lenta.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55524D; font-size: 12px; font-weight: 700">
      <span style="height: 32px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55524D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>Saralangan
    </a>
    <a href="Lenta.dc.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #55524D; font-size: 12px; font-weight: 700">
      <span style="height: 32px; display: flex; align-items: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55524D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>Profil
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: "all", live: false };
  }
  renderVals() {
    var self = this, s = this.state;
    var CATS = [
      { id: "all", name: "Hammasi" },
      { id: "kitob", name: "Kitob", tile: "#F1D9D9", ink: "#7E1F1F" },
      { id: "xizmat", name: "Xizmatlar", tile: "#DDE1F7", ink: "#1E2A9E" },
      { id: "taom", name: "Taomlar", tile: "#F4DCCB", ink: "#8A3410" },
      { id: "kofe", name: "Kofe", tile: "#E8DDCC", ink: "#5B3A12" },
      { id: "sport", name: "Sport", tile: "#D7EEDF", ink: "#145A33" },
      { id: "gozal", name: "Go'zallik", tile: "#E2E2DE", ink: "#2E2E2B" },
      { id: "kino", name: "Kino", tile: "#E9DDF0", ink: "#5B2479" }
    ];
    var byId = {};
    CATS.forEach(function (c) { byId[c.id] = c; });
    var DEALS = [
      { cat: "kitob", store: "Sahifa", area: "Chilonzor · 0,4 km", title: "Darsliklar va daftarlar", pct: "−20%", price: "48 000", old: "60 000", save: "12 000 so'm tejaysiz", left: "37 ta qoldi", live: true, status: "Hozir ochiq · 21:00 gacha" },
      { cat: "xizmat", store: "Nusxa Markaz", area: "Olmazor · 0,7 km", title: "A4 chop etish, 100 varaq", pct: "−30%", price: "21 000", old: "30 000", save: "9 000 so'm tejaysiz", left: "120 ta qoldi", live: true, status: "Hozir ochiq · 20:00 gacha" },
      { cat: "xizmat", store: "Shifo Med", area: "Yunusobod · 2,1 km", title: "Umumiy tibbiy ko'rik", pct: "−25%", price: "150 000", old: "200 000", save: "50 000 so'm tejaysiz", left: "8 ta qoldi", low: true, live: true, status: "Hozir ochiq · 18:00 gacha" },
      { cat: "taom", store: "Lavash Markazi", area: "Chilonzor · 1,2 km", title: "Lavash + ayron", pct: "1+1", price: "32 000", old: "", save: "Ikkinchisi bepul", left: "50 ta qoldi", live: false, status: "Bugun 11:00 da ochiladi", soon: true },
      { cat: "kofe", store: "Qahva Bekati", area: "Mirzo Ulug'bek · 3,4 km", title: "Kapuchino 300 ml", pct: "−25%", price: "21 000", old: "28 000", save: "7 000 so'm tejaysiz", left: "80 ta qoldi", live: false, status: "Yopiq · ertaga 08:00 da" },
      { cat: "kino", store: "Kadr Kinoteatri", area: "Olmazor · 4,8 km", title: "Kino chiptasi, 2D seans", pct: "−44%", price: "25 000", old: "45 000", save: "20 000 so'm tejaysiz", left: "149 ta qoldi", live: true, status: "Hozir ochiq · 23:00 gacha" }
    ];
    var list = DEALS.filter(function (d) {
      return (s.cat === "all" || d.cat === s.cat) && (!s.live || d.live);
    });
    var deals = list.map(function (d) {
      var c = byId[d.cat];
      return {
        tile: c.tile, ink: c.ink, catName: c.name, initial: d.store.charAt(0),
        store: d.store, area: d.area, title: d.title, pct: d.pct, price: d.price, old: d.old, hasOld: !!d.old,
        save: d.save, left: d.left, leftColor: d.low ? "#B23A0C" : "#6B6760",
        status: d.status, statusColor: d.live ? "#1F8A47" : (d.soon ? "#B23A0C" : "#3A3834"),
        dot: d.live ? "#3BD16F" : (d.soon ? "#FF5A1F" : "#8A877F")
      };
    });
    var cats = CATS.map(function (c) {
      var on = s.cat === c.id;
      return { name: c.name, on: on ? "true" : "false", bg: on ? "#111111" : "#FFFFFF", color: on ? "#FFFFFF" : "#111111",
        border: on ? "#111111" : "#D6D2CB", pick: function () { self.setState({ cat: c.id }); } };
    });
    return {
      cats: cats, deals: deals, empty: deals.length === 0,
      count: deals.length + " ta chegirma",
      liveOn: s.live ? "true" : "false", track: s.live ? "#2432D6" : "#CFCBC4", knob: s.live ? "16px" : "2px",
      toggleLive: function () { self.setState({ live: !s.live }); },
      reset: function () { self.setState({ cat: "all", live: false }); }
    };
  }
}
</script>
</body>
</html>
