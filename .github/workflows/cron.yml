# Rejalashtirilgan bildirishnomalarni yuborish: Vercel Hobby cron'i kuniga 1 marta ishlaydi, shuning uchun
# har 5 daqiqada GitHub Actions saytdagi cron manzilini chaqiradi (bepul).
# Repo sozlamalari → Secrets and variables → Actions:
#   CRON_SECRET — Vercel'dagi CRON_SECRET bilan bir xil qiymat
#   APP_URL     — https://talabapass.vercel.app (oxirida "/" siz)
# Eslatma: GitHub jadvaldagi ishni bir necha daqiqaga kechiktirishi mumkin; 60 kun faolsiz repoda jadval o'chadi (qo'lda yoqiladi).
name: cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  notifications:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Muddati kelgan bildirishnomalarni yuborish
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET va APP_URL secret'lari o'rnatilmagan" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 60 \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/bildirishnomalar"
